# Node plugin - runs as DaemonSet on every node
# Handles: NodeStageVolume, NodePublishVolume, NodeUnstageVolume, NodeUnpublishVolume, NodeGetVolumeStats, NodeExpandVolume
---
kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: csi-vcloud-node
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: csi-vcloud-node
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: csi-vcloud-plugin
      labels:
        app: csi-vcloud-node
        role: csi-vcloud
    spec:
      priorityClassName: system-node-critical
      serviceAccountName: csi-vcloud-node-sa
      hostNetwork: true
      containers:
        # CSI Node Driver Registrar - registers the driver with kubelet
        - name: csi-node-driver-registrar
          image: k8s.io.reg.vnetwork.dev/techev/csi/csi-node-driver-registrar:v2.10.1@sha256:7aecaebde9e35fee6f40b80db5be9f78d1385baab42b6b50a52a4275fc1728f9
          args:
            - "--v=5"
            - "--csi-address=$(ADDRESS)"
            - "--kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)"
          env:
            - name: ADDRESS
              value: /csi/csi.sock
            - name: DRIVER_REG_SOCK_PATH
              value: /var/lib/kubelet/plugins/vcloud.csi.vnetwork.dev/csi.sock
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi/
            - name: registration-dir
              mountPath: /registration/

        # vCloud CSI Plugin
        - name: csi-vcloud-plugin
          image: k8s.io.reg.vnetwork.dev/techev/csi/driver:v2.1.3@sha256:57fdaa994405649fb45c0e87f253f3fdb61a4da84607b7b572af44a4d458b6dd
          args:
            - "--endpoint=$(CSI_ENDPOINT)"
          env:
            - name: CSI_ENDPOINT
              value: unix:///csi/csi.sock
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          imagePullPolicy: Always
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
            allowPrivilegeEscalation: true
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: pods-mount-dir
              mountPath: /var/lib/kubelet
              # needed so that any mounts setup inside this container are
              # propagated back to the host machine.
              mountPropagation: "Bidirectional"
            - name: device-dir
              mountPath: /dev
            - name: cloud-config
              mountPath: /etc/config
              readOnly: true

      volumes:
        - name: cloud-config
          hostPath:
            path: /etc/config
            type: Directory
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry/
            type: DirectoryOrCreate
        - name: plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins/vcloud.csi.vnetwork.dev
            type: DirectoryOrCreate
        - name: pods-mount-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: device-dir
          hostPath:
            path: /dev
