# Controller plugin - runs as StatefulSet with single replica
# Handles: CreateVolume, DeleteVolume, ControllerPublishVolume, ControllerUnpublishVolume, CreateSnapshot, DeleteSnapshot
---
kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: csi-vcloud-controller
  namespace: kube-system
spec:
  serviceName: "csi-vcloud"
  replicas: 1
  selector:
    matchLabels:
      app: csi-vcloud-controller
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: csi-vcloud-plugin
      labels:
        app: csi-vcloud-controller
        role: csi-vcloud
    spec:
      priorityClassName: system-cluster-critical
      serviceAccountName: csi-vcloud-controller-sa
      containers:
        # CSI Provisioner - creates/deletes volumes
        - name: csi-provisioner
          image: k8s.io.reg.vnetwork.dev/techev/csi/csi-provisioner:v5.0.1@sha256:a4ac71f426c797ed1f2e004104dd911406bb4a13da62d0042ee949001c8f83a9
          args:
            - "--csi-address=$(ADDRESS)"
            - "--default-fstype=ext4"
            - "--v=5"
          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/

        # CSI Attacher - attaches/detaches volumes to nodes
        - name: csi-attacher
          image: k8s.io.reg.vnetwork.dev/techev/csi/csi-attacher:v4.6.1@sha256:083ca2c6157292b25a023927a4fcf8672528f679da4206e1d1c75b2a84c36489
          args:
            - "--csi-address=$(ADDRESS)"
            - "--v=5"
            - "--reconcile-sync=30m"
            - "--timeout=2m"
          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/

        # CSI Snapshotter - creates/deletes snapshots
        - name: csi-snapshotter
          image: k8s.io.reg.vnetwork.dev/techev/csi/csi-snapshotter:v8.0.1@sha256:55df86d098a7a38e5b3ccf30f78742928a843938c53f1aece1143dda0da249d1
          args:
            - "--csi-address=$(ADDRESS)"
            - "--v=5"
          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/

        # CSI Resizer - expands volumes
        - name: csi-resizer
          image: k8s.io.reg.vnetwork.dev/techev/csi/csi-resizer:v1.11.1@sha256:1fa4aa5660346fafb5d166e96edc0bfdcd1f6a98f3fa21f78ff3f52cebf5a327
          args:
            - "--csi-address=$(ADDRESS)"
            - "--timeout=30s"
            - "--v=5"
            - "--handle-volume-inuse-error=false"
          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/

        # vCloud CSI Plugin
        - name: csi-vcloud-plugin
          image: k8s.io.reg.vnetwork.dev/techev/csi/driver:v2.1.3@sha256:57fdaa994405649fb45c0e87f253f3fdb61a4da84607b7b572af44a4d458b6dd
          args:
            - "--endpoint=$(CSI_ENDPOINT)"
          env:
            - name: CSI_ENDPOINT
              value: unix:///var/lib/csi/sockets/pluginproxy/csi.sock
          imagePullPolicy: Always
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
            - name: cloud-config
              mountPath: /etc/config
              readOnly: true

      volumes:
        - name: socket-dir
          emptyDir: {}
        - name: cloud-config
          hostPath:
            path: /etc/config
            type: Directory
