# PVC Expansion Validation Webhook
# Blocks PVC expansion when volume is not attached to a workload
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pvc-expand-webhook
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pvc-expand-webhook
rules:
  # Read PVCs and PVs
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "persistentvolumes"]
    verbs: ["get", "list"]
  # Read VolumeAttachments to check if volume is attached
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list"]
  # Read pods to check if PVC is in use
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pvc-expand-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pvc-expand-webhook
subjects:
  - kind: ServiceAccount
    name: pvc-expand-webhook
    namespace: kube-system
---
apiVersion: v1
kind: Service
metadata:
  name: pvc-expand-webhook
  namespace: kube-system
spec:
  ports:
    - port: 443
      targetPort: 8443
  selector:
    app: pvc-expand-webhook
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pvc-expand-webhook
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pvc-expand-webhook
  template:
    metadata:
      labels:
        app: pvc-expand-webhook
    spec:
      serviceAccountName: pvc-expand-webhook
      containers:
        - name: webhook
          image: k8s.io.reg.vnetwork.dev/techev/csi/pvc-expand-webhook:1.0.0@sha256:2f3f875db7fc6d9f0d2d8261f512092298de1b62d652fa30105c3244d76a9243
          ports:
            - containerPort: 8443
          volumeMounts:
            - name: tls
              mountPath: /etc/webhook/certs
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: pvc-expand-webhook-tls
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: pvc-expand-webhook
webhooks:
  - name: pvc-expand.vcloud.csi.vnetwork.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore  # Don't block if webhook is unavailable
    matchPolicy: Equivalent
    clientConfig:
      service:
        name: pvc-expand-webhook
        namespace: kube-system
        path: /validate
      caBundle: 
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["persistentvolumeclaims"]
        scope: "Namespaced"
    # Only validate PVCs from vCloud CSI driver
    objectSelector:
      matchExpressions:
        - key: app.kubernetes.io/managed-by
          operator: DoesNotExist  # Will validate all PVCs, or add label selector
