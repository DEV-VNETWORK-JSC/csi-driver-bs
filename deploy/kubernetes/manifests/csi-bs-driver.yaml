---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: csi-bs-snapshotter-binding
  labels:
    app.kubernetes.io/instance: bs.csi.vnetwork.dev
    app.kubernetes.io/part-of: csi-driver-bs
subjects:
  - kind: ServiceAccount
