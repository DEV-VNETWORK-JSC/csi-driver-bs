# Block Storage (BS) CSI Driver
# This file contains the CSI driver deployment (RBAC, Controller, Node)
#
# Prerequisites:
# 1. Install VolumeSnapshot CRDs: kubectl apply -f snapshot-crds.yaml
# 2. Install csi-snapshot-controller: kubectl apply -f csi-snapshot-controller.yaml
# 3. Create cloud-config at /etc/config/cloud-config on all nodes
#
# Deploy:
#   kubectl apply -f csi-bs-driver.yaml
#   kubectl apply -f csi-bs-storageclass.yaml
#
# Note: Container images must be built for linux/amd64 architecture

# =============================================================================
# CSI Driver Registration
# =============================================================================
---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: bs.csi.vnetwork.dev
spec:
  attachRequired: true
  podInfoOnMount: true
  fsGroupPolicy: File
  volumeLifecycleModes:
    - Persistent

# =============================================================================
# Service Accounts
# =============================================================================
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: csi-bs-controller-sa
  namespace: kube-system
  labels:
    app.kubernetes.io/instance: bs.csi.vnetwork.dev
    app.kubernetes.io/part-of: csi-driver-bs

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: csi-bs-node-sa
  namespace: kube-system
  labels:
    app.kubernetes.io/instance: bs.csi.vnetwork.dev
    app.kubernetes.io/part-of: csi-driver-bs

# =============================================================================
# Controller RBAC - Provisioner
# =============================================================================
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: csi-bs-provisioner-role
  labels:
    app.kubernetes.io/instance: bs.csi.vnetwork.dev
    app.kubernetes.io/part-of: csi-driver-bs
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch"]

---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: csi-bs-provisioner-binding
  labels:
    app.kubernetes.io/instance: bs.csi.vnetwork.dev
    app.kubernetes.io/part-of: csi-driver-bs
subjects:
  - kind: ServiceAccount
    name: csi-bs-controller-sa
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: csi-bs-provisioner-role
  apiGroup: rbac.authorization.k8s.io

# =============================================================================
# Controller RBAC - Attacher
# =============================================================================
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
