  labels:
    app.kubernetes.io/instance: bs.csi.vnetwork.dev
    app.kubernetes.io/part-of: csi-driver-bs
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments/status"]
    verbs: ["patch"]

---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: csi-bs-attacher-binding
  labels:
    app.kubernetes.io/instance: bs.csi.vnetwork.dev
    app.kubernetes.io/part-of: csi-driver-bs
subjects:
  - kind: ServiceAccount
    name: csi-bs-controller-sa
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: csi-bs-attacher-role
  apiGroup: rbac.authorization.k8s.io

# =============================================================================
