# =============================================================================
# Controller StatefulSet
# Handles: CreateVolume, DeleteVolume, ControllerPublishVolume,
#          ControllerUnpublishVolume, CreateSnapshot, DeleteSnapshot
# =============================================================================
---
kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: csi-bs-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: csi-bs-controller
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: bs.csi.vnetwork.dev
    app.kubernetes.io/part-of: csi-driver-bs
spec:
  serviceName: "csi-bs"
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: csi-bs-controller
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: bs
      labels:
        app.kubernetes.io/name: csi-bs-controller
        app.kubernetes.io/component: controller
        app.kubernetes.io/instance: bs.csi.vnetwork.dev
        app.kubernetes.io/part-of: csi-driver-bs
    spec:
      priorityClassName: system-cluster-critical
      serviceAccountName: csi-bs-controller-sa
      containers:
        # Liveness Probe
        - name: liveness-probe
          image: k8s.io.reg.vnetwork.dev/techev/csi/livenessprobe:v2.13.1
          args:
            - --csi-address=/var/lib/csi/sockets/pluginproxy/csi.sock
            - --probe-timeout=3s
            - --http-endpoint=localhost:29652
            - --v=2
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
          resources:
            limits:
              memory: 100Mi
            requests:
              cpu: 10m
              memory: 20Mi

        # CSI Provisioner - creates/deletes volumes
        - name: csi-provisioner
          image: k8s.io.reg.vnetwork.dev/techev/csi/csi-provisioner:v5.0.1
          args:
            - "--csi-address=$(ADDRESS)"
            - "--default-fstype=ext4"
            - "--v=5"
          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/

        # CSI Attacher - attaches/detaches volumes to nodes
        - name: csi-attacher
          image: k8s.io.reg.vnetwork.dev/techev/csi/csi-attacher:v4.6.1
          args:
            - "--csi-address=$(ADDRESS)"
            - "--v=5"
            - "--reconcile-sync=30m"
            - "--timeout=2m"
          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/

        # CSI Snapshotter - creates/deletes snapshots
        - name: csi-snapshotter
          image: k8s.io.reg.vnetwork.dev/techev/csi/csi-snapshotter:v8.0.1
          args:
            - "--csi-address=$(ADDRESS)"
            - "--v=5"
          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/

        # CSI Resizer - expands volumes
        - name: csi-resizer
          image: k8s.io.reg.vnetwork.dev/techev/csi/csi-resizer:v1.11.1
          args:
            - "--csi-address=$(ADDRESS)"
            - "--timeout=30s"
            - "--v=5"
            - "--handle-volume-inuse-error=false"
          env:
            - name: ADDRESS
              value: /var/lib/csi/sockets/pluginproxy/csi.sock
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/

        # Block Storage CSI Plugin
        - name: bs
          image: k8s.io.reg.vnetwork.dev/techev/csi/csi-bs-driver:v2.2.0
          args:
            - "--drivername=bs.csi.vnetwork.dev"
            - "--endpoint=$(CSI_ENDPOINT)"
            - "--v=2"
          env:
            - name: CSI_ENDPOINT
              value: unix:///var/lib/csi/sockets/pluginproxy/csi.sock
          imagePullPolicy: Always
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "test -S /var/lib/csi/sockets/pluginproxy/csi.sock"
            failureThreshold: 5
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/csi/sockets/pluginproxy/
            - name: cloud-config
              mountPath: /etc/config
              readOnly: true
          resources:
            limits:
              memory: 200Mi
            requests:
              cpu: 10m
              memory: 20Mi

      volumes:
        - name: socket-dir
          emptyDir: {}
        - name: cloud-config
          hostPath:
            path: /etc/config
            type: Directory

# =============================================================================
# Node DaemonSet
# Handles: NodeStageVolume, NodePublishVolume, NodeUnstageVolume,
#          NodeUnpublishVolume, NodeGetVolumeStats, NodeExpandVolume
# =============================================================================
---
kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: csi-bs-node
  namespace: kube-system
  labels:
    app.kubernetes.io/name: csi-bs-node
    app.kubernetes.io/component: node
    app.kubernetes.io/instance: bs.csi.vnetwork.dev
    app.kubernetes.io/part-of: csi-driver-bs
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: csi-bs-node
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: bs
      labels:
        app.kubernetes.io/name: csi-bs-node
        app.kubernetes.io/component: node
        app.kubernetes.io/instance: bs.csi.vnetwork.dev
        app.kubernetes.io/part-of: csi-driver-bs
    spec:
      priorityClassName: system-node-critical
      serviceAccountName: csi-bs-node-sa
      hostNetwork: true
      containers:
        # Liveness Probe
        - name: liveness-probe
          image: k8s.io.reg.vnetwork.dev/techev/csi/livenessprobe:v2.13.1
          args:
            - --csi-address=/csi/csi.sock
            - --probe-timeout=3s
            - --http-endpoint=localhost:29653
            - --v=2
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
          resources:
            limits:
              memory: 100Mi
            requests:
              cpu: 10m
              memory: 20Mi

        # CSI Node Driver Registrar - registers the driver with kubelet
        - name: node-driver-registrar
          image: k8s.io.reg.vnetwork.dev/techev/csi/csi-node-driver-registrar:v2.10.1
          args:
            - "--v=5"
            - "--csi-address=$(ADDRESS)"
            - "--kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)"
          env:
            - name: ADDRESS
              value: /csi/csi.sock
            - name: DRIVER_REG_SOCK_PATH
              value: /var/lib/kubelet/plugins/bs.csi.vnetwork.dev/csi.sock
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi/
            - name: registration-dir
              mountPath: /registration/

        # Block Storage CSI Plugin
        - name: bs
          image: k8s.io.reg.vnetwork.dev/techev/csi/csi-bs-driver:v2.2.0
          args:
            - "--drivername=bs.csi.vnetwork.dev"
            - "--endpoint=$(CSI_ENDPOINT)"
            - "--v=2"
          env:
            - name: CSI_ENDPOINT
              value: unix:///csi/csi.sock
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          imagePullPolicy: Always
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
            allowPrivilegeEscalation: true
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "test -S /csi/csi.sock"
            failureThreshold: 5
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: pods-mount-dir
              mountPath: /var/lib/kubelet
              # needed so that any mounts setup inside this container are
              # propagated back to the host machine.
              mountPropagation: "Bidirectional"
            - name: device-dir
              mountPath: /dev
            - name: cloud-config
              mountPath: /etc/config
              readOnly: true
          resources:
            limits:
              memory: 300Mi
            requests:
              cpu: 10m
              memory: 20Mi

      volumes:
        - name: cloud-config
          hostPath:
            path: /etc/config
            type: Directory
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry/
            type: DirectoryOrCreate
        - name: plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins/bs.csi.vnetwork.dev
            type: DirectoryOrCreate
        - name: pods-mount-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: device-dir
          hostPath:
            path: /dev
