apiVersion: v1
kind: Pod
metadata:
  name: busybox-1
spec:
  containers:
    - name: busybox
      image: busybox
      command: [ "sleep", "180" ]
      volumeMounts:
        - name: example-pvc-volume
          mountPath: /data
  volumes:
    - name: example-pvc-volume
      persistentVolumeClaim:
        claimName: test-pvc